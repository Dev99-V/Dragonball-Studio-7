name: DR7-Studio Governance, Engine Parity & Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Frontend + WASM E2E Test
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pixel asset verification dependencies
        run: python3 -m pip install numpy Pillow scipy

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run DR7 Governance & Engine-Localhost Parity Check
        run: ./loop.sh check

      - name: Run Python & Frontend WASM E2E Unit Tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Rust >2,000 Real-Time Combat Core Unit Tests
        run: cargo test --manifest-path engines/rust_combat_sim/Cargo.toml

      - name: Build Rust WASM library
        run: cargo build --manifest-path engines/rust_combat_sim/Cargo.toml --target wasm32-unknown-unknown --release --lib

      - name: Install verified Godot version
        run: bash tools/godot/install_godot.sh

      - name: Import textures and verify Godot character bundles
        run: |
          ./tools/godot/godot --headless --path . --editor --import
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_character_bundles.gd
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_tasmanian_charge.gd
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_sarcosuchus_charge.gd
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_dilophosaurus_power.gd
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_bat_sonic.gd
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_bat_turn.gd
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_trex_turn.gd
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_chilopoda_actions.gd
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_floating_camera_actions.gd
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_arena_sandbox.gd
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_shenron_summon.gd
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_dragon_ball_items.gd
          if command -v xvfb-run >/dev/null 2>&1; then
            timeout 60s xvfb-run -a ./tools/godot/godot --rendering-driver opengl3 --path . --script res://tests/test_compatibility_shaders.gd
            timeout 60s xvfb-run -a ./tools/godot/godot --rendering-driver opengl3 --path . --script res://tests/test_shenron_dissolve_render.gd
          fi

  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android APK signing
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot 4.7.2 & Export Templates
        run: bash tools/godot/install_godot.sh --with-templates

      - name: Configure Android SDK & Debug Keystore for Godot 4.7
        run: |
          mkdir -p "$HOME/.local/share/godot/keystores" "$HOME/.config/godot"
          if [ ! -f "$HOME/.local/share/godot/keystores/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.local/share/godot/keystores/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/debug_keystore = "$HOME/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$SDK_DIR"
          EOF

      - name: Export & Sign Android Debug APK (./loop.sh apk-debug)
        run: |
          ./loop.sh apk-debug
          APKSIGNER="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose build/android/dr7-studio-debug.apk
          sha256sum build/android/dr7-studio-debug.apk

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dr7-studio-debug-apk
          path: build/android/dr7-studio-debug.apk
          retention-days: 7

  deploy-alpha-staging:
    name: Auto-Sync Alpha Staging (Web + APK + iOS IPA + Windows setup.exe -> Cloudflare R2/Worker)
    needs: [verify, build-android-apk]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: dr7-alpha-staging-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required Staging GitHub Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!k:-}" ]; then
              missing="${missing} ${k}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Thiếu GitHub Actions Secrets để đồng bộ tự động lên Cloudflare Staging:${missing}"
            echo "Hãy cấu hình 4 secrets này trong Settings -> Secrets and variables -> Actions của repo."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js & Wrangler CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler CLI & NSIS (makensis)
        run: |
          npm install -g wrangler
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis

      - name: Install Godot 4.7.2 & Export Templates
        run: bash tools/godot/install_godot.sh --with-templates

      - name: Download Android Debug APK from build-android-apk job
        uses: actions/download-artifact@v4
        with:
          name: dr7-studio-debug-apk
          path: build/android

      - name: Export Godot 4.7.2 Web (Compatibility)
        run: ./loop.sh web-export

      - name: Export & Pack Windows PC Installer (setup.exe x64)
        run: ./loop.sh win-setup

      - name: Fetch Base iOS IPA from Private R2 & Repack 1:1 Unsigned IPA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p build/ios/base
          if ! (cd cloudflare/alpha-staging && wrangler r2 object get dr7-alpha-artifacts/base/dr7-studio-base.ipa --remote --file "$GITHUB_WORKSPACE/build/ios/base/dr7-studio-base.ipa"); then
            echo "[INFO] base/dr7-studio-base.ipa chưa có trong R2, fallback lấy IPA bản trước từ manifest.json..."
            (cd cloudflare/alpha-staging && wrangler r2 object get dr7-alpha-artifacts/manifest.json --remote --file /tmp/prev-manifest.json)
            PREV_IPA_KEY="$(python3 -c 'import json; print(json.load(open("/tmp/prev-manifest.json"))["artifacts"]["ipa"]["r2_key"])')"
            (cd cloudflare/alpha-staging && wrangler r2 object get "dr7-alpha-artifacts/${PREV_IPA_KEY}" --remote --file "$GITHUB_WORKSPACE/build/ios/base/dr7-studio-base.ipa")
          fi
          ./loop.sh ios-repack build/ios/base/dr7-studio-base.ipa

      - name: Deploy All 4 Formats (Web/APK/IPA/Windows setup.exe) + Worker to Cloudflare Staging & Verify SHA-256
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 tools/alpha/deploy_alpha_r2_and_worker.py
